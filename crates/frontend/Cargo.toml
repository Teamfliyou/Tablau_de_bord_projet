[package]
name = "tdb-frontend"
version = "4.0.0"
edition = "2021"
description = "Interface du Tableau de bord étudiant (Leptos, Rust compilé en WebAssembly)"
license = "MIT"

[dependencies]
tdb-shared = { path = "../shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement",
    "DomTokenList", "Storage", "Navigator", "MediaQueryList", "Blob", "BlobPropertyBag", "File",
    "FileList", "Url", "Event", "EventTarget",
] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = "0.3"
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
