[package]
name = "tdb-mcp"
version = "5.1.0"
edition = "2021"
description = "Serveur MCP local (stdio) du Tableau de bord étudiant : accès contrôlé de Hermes Agent aux devoirs"
license = "MIT"

[lib]
name = "tdb_mcp"
path = "src/lib.rs"

[[bin]]
name = "tdb-mcp"
path = "src/main.rs"

[dependencies]
tdb-core = { path = "../core" }
tdb-shared = { path = "../shared" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
