[package]
name = "tdb-server"
version = "4.1.0"
edition = "2021"
description = "Serveur Web (Axum) du Tableau de bord étudiant : API REST, authentification et frontend Leptos"
license = "MIT"

[lib]
name = "tdb_server"
path = "src/lib.rs"

[[bin]]
name = "tdb-server"
path = "src/main.rs"

[dependencies]
tdb-core = { path = "../core" }
tdb-shared = { path = "../shared" }
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["query"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = "9"
bcrypt = "0.17"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
