# ============================================================
#  Tableau de bord étudiant — Docker Compose
#  Démarre l'API FastAPI + le frontend (servi par FastAPI)
#  sur le port 8000, avec persistance de la base SQLite.
# ============================================================

services:
  app:
    build: .
    container_name: tableau-de-bord
    ports:
      - "8000:8000"        # Application + API : http://localhost:8000
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  app-data:
