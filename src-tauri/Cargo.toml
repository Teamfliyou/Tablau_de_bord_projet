[package]
name = "tableau-de-bord-etudiant"
version = "4.0.0"
description = "Tableau de bord étudiant : emploi du temps ADE, devoirs Kanban et plan de révision IA"
authors = ["Teamfliyou"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "tableau_de_bord_etudiant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tdb-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
keyring = { version = "3", features = ["windows-native"] }
